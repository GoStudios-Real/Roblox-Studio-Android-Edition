<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1115">
<title>Signing in — Roblox Studio Android Edition</title>
<style>
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
         background:#0f1115; color:#e8eaed; font:15px/1.5 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .box { text-align:center; padding:32px; }
  .spin { width:42px; height:42px; margin:0 auto 18px; border-radius:50%;
          border:4px solid #2a2f38; border-top-color:#00a2ff; animation:sp .9s linear infinite; }
  @keyframes sp { to { transform:rotate(360deg); } }
  h1 { font-size:18px; margin:0 0 6px; font-weight:600; }
  .m { color:#8b929c; font-size:13px; }
  code { background:#1a1e25; padding:2px 6px; border-radius:5px; }
</style>
</head>
<body>
<div class="box">
  <div class="spin"></div>
  <h1>Completing Roblox sign-in…</h1>
  <p class="m">Redirecting back to the editor. You can close this tab if nothing happens.</p>
</div>
<script>
(function () {
  var q = location.search || '';
  try { sessionStorage.setItem('rsa:oauth_return', q); } catch (e) {}
  location.replace('index.html' + q);
})();
</script>
</body>
</html>
